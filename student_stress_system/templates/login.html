<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – DailyPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sun: #FFD166;
      --sky: #E8F4FD;
      --mint: #06D6A0;
      --coral: #EF476F;
      --ink: #1A1A2E;
      --slate: #4A5568;
      --cloud: #F7FAFC;
      --border: #E2E8F0;
      --card: #FFFFFF;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(26,26,46,0.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--sky);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(circle at 20% 20%, #FFD16640 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, #06D6A020 0%, transparent 50%);
    }

    .wrapper {
      width: 100%;
      max-width: 420px;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: var(--sun);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 12px;
      box-shadow: 0 4px 12px rgba(255,209,102,0.4);
    }

    .brand h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 28px;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .brand p {
      color: var(--slate);
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 36px;
      border: 1px solid var(--border);
    }

    .card h2 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--ink);
      margin-bottom: 24px;
    }

    .flash {
      background: #FFF3F5;
      border: 1px solid #FECDD3;
      color: var(--coral);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--cloud);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(6,214,160,0.15);
      background: #fff;
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: #2D2D4E; }
    .btn:active { transform: scale(0.99); }

    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--slate);
    }

    .footer-link a {
      color: var(--mint);
      font-weight: 600;
      text-decoration: none;
    }

    .footer-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="brand">
      <div class="brand-icon">🌤</div>
      <h1>DailyPulse</h1>
      <p>Track your wellness, one day at a time</p>
    </div>

    <div class="card">
      <h2>Welcome back</h2>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
            <div class="flash">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST" action="/login">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn">Sign In</button>
      </form>
    </div>

    <p class="footer-link">Don't have an account? <a href="/register">Create one</a></p>
  </div>
</body>
</html>
