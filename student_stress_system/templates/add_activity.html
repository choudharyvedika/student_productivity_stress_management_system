<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Log Activity – DailyPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sun: #FFD166;
      --sky: #E8F4FD;
      --mint: #06D6A0;
      --coral: #EF476F;
      --ink: #1A1A2E;
      --slate: #4A5568;
      --muted: #718096;
      --cloud: #F7FAFC;
      --border: #E2E8F0;
      --card: #FFFFFF;
      --radius: 16px;
      --shadow: 0 4px 24px rgba(26,26,46,0.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--sky);
      min-height: 100vh;
      background-image: radial-gradient(circle at 15% 85%, #06D6A015 0%, transparent 50%);
    }

    nav {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(26,26,46,0.05);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .nav-icon {
      width: 34px;
      height: 34px;
      background: var(--sun);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .nav-brand span {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--ink);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links a {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      color: var(--slate);
      transition: background 0.15s, color 0.15s;
    }

    .nav-links a:hover { background: var(--sky); color: var(--ink); }
    .nav-links a.active { background: var(--ink); color: #fff; }
    .nav-links a.logout { color: var(--coral); }
    .nav-links a.logout:hover { background: #FFF3F5; }

    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 36px 24px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
      transition: color 0.15s;
    }

    .back-link:hover { color: var(--ink); }

    .page-header {
      margin-bottom: 28px;
    }

    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      color: var(--ink);
      letter-spacing: -0.5px;
    }

    .page-header p {
      color: var(--muted);
      margin-top: 4px;
      font-size: 15px;
    }

    .flash-error {
      background: #FFF3F5;
      border: 1px solid #FECDD3;
      color: var(--coral);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 32px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--slate);
      margin-bottom: 6px;
    }

    label .hint {
      font-weight: 400;
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }

    input[type="date"],
    input[type="number"] {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--cloud);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input:focus {
      border-color: var(--mint);
      box-shadow: 0 0 0 3px rgba(6,214,160,0.15);
      background: #fff;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 24px 0;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }

    .btn-submit {
      flex: 1;
      padding: 13px;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover { background: #2D2D4E; }

    .btn-cancel {
      padding: 13px 22px;
      background: var(--cloud);
      color: var(--slate);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn-cancel:hover { background: var(--border); }

    @media (max-width: 500px) {
      .form-row { grid-template-columns: 1fr; }
      .nav-links a:not(.active):not(.logout) { display: none; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="/dashboard">
      <div class="nav-icon">🌤</div>
      <span>DailyPulse</span>
    </a>
    <div class="nav-links">
      <a href="/dashboard">Dashboard</a>
      <a href="/add-activity" class="active">+ Add</a>
      <a href="/logout" class="logout">Logout</a>
    </div>
  </nav>

  <main>
    <a href="/dashboard" class="back-link">← Back to Dashboard</a>

    <div class="page-header">
      <h1>Log Activity</h1>
      <p>Record your habits and wellbeing for the day</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="flash-error">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
      <form method="POST" action="/add-activity">

        <p class="section-title">Date</p>
        <div class="form-group">
          <label for="date">Activity Date</label>
          <input type="date" id="date" name="date" required />
        </div>

        <div class="divider"></div>
        <p class="section-title">Time Spent</p>

        <div class="form-row">
          <div class="form-group">
            <label for="study">Study <span class="hint">hours</span></label>
            <input type="number" id="study" name="study" min="0" max="24" step="0.5" placeholder="0" required />
          </div>
          <div class="form-group">
            <label for="sleep">Sleep <span class="hint">hours</span></label>
            <input type="number" id="sleep" name="sleep" min="0" max="24" step="0.5" placeholder="0" required />
          </div>
          <div class="form-group">
            <label for="screen">Screen Time <span class="hint">hours</span></label>
            <input type="number" id="screen" name="screen" min="0" max="24" step="0.5" placeholder="0" required />
          </div>
          <div class="form-group">
            <label for="social">Social <span class="hint">hours</span></label>
            <input type="number" id="social" name="social" min="0" max="24" step="0.5" placeholder="0" required />
          </div>
        </div>

        <div class="form-group">
          <label for="exercise">Exercise <span class="hint">minutes</span></label>
          <input type="number" id="exercise" name="exercise" min="0" max="1440" step="5" placeholder="0" required />
        </div>

        <div class="divider"></div>
        <div class="form-actions">
          <a href="/dashboard" class="btn-cancel">Cancel</a>
          <button type="submit" class="btn-submit">Save Activity</button>
        </div>

      </form>
    </div>
  </main>
</body>
</html>
